<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Agent Course</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>AI Agent Course Platform</h2>
    <div class="tabs">
        <button onclick="showTab('register')">User Registration</button>
        <button onclick="showTab('admin')">Admin Panel</button>
    </div>

    <!-- User Registration Tab -->
    <div id="registerTab" class="tabContent">
        <p>Learn how AI Agents work & how to build them</p>
        <form id="registerForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="tel" id="phone" placeholder="Phone Number" required>
            <input type="tel" id="whatsapp" placeholder="WhatsApp Number (Required)" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Register</button>
        </form>
        <div id="message"></div>
    </div>

    <!-- Admin Panel Tab -->
    <div id="adminTab" class="tabContent" style="display:none;">
        <h3>Admin Dashboard</h3>
        <table id="usersTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>WhatsApp</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
